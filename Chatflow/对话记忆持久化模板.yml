app:
  description: '本工作流旨在解决大模型上下文窗口限制导致的记忆丢失问题，通过将每轮对话（用户问题和助手回答）存入向量数据库，并在后续对话中动态检索相关历史记录，实现长期记忆能力。


    核心流程：


    记忆写入：每轮对话结束后，将本轮问答内容自动更新到指定的知识库中，形成持久化记忆。


    记忆读取：新对话开始时，首先判断是否为第一轮（无历史记忆），若不是则提取用户问题的关键词进行语义扩展，然后从知识库中检索与最近10轮对话及当前问题最相关的内容，作为上下文辅助模型生成回答。


    文件处理：支持上传文件并自动存入知识库，丰富记忆来源。


    记忆窗口：通过配置LLM节点的记忆窗口（默认为50轮），确保模型能利用近期对话信息，同时结合向量检索扩展长期记忆。'
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 对话记忆持久化模板
  use_icon_as_answer_icon: false
